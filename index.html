<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stargate Explorer</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: ui-monospace, "JetBrains Mono", Menlo, monospace; }
      canvas { display: block; }
      #hud { position: fixed; inset: 0; pointer-events: none; color: #cfe9ff; text-shadow: 0 0 4px rgba(0,0,0,.8); }
      #hud .speed { position: absolute; left: 24px; bottom: 24px; font-size: 28px; letter-spacing: .04em; }
      #hud .speed small { font-size: 12px; opacity: .7; margin-left: 6px; }
      #hud .throttle { position: absolute; left: 24px; bottom: 64px; width: 160px; height: 6px; background: rgba(120,160,200,.25); }
      #hud .throttle > i { display: block; height: 100%; width: 0; background: #7fd4ff; }
      #hud .boost { position: absolute; left: 24px; bottom: 76px; width: 160px; height: 3px; background: rgba(255,200,120,.2); }
      #hud .boost > i { display: block; height: 100%; width: 100%; background: #ffc271; }
      #hud .boost > i.low { background: #b0653a; }
      #hud .hint { position: absolute; left: 0; right: 0; top: 40%; text-align: center; font-size: 14px; opacity: .85; }
      #hud .hint.hidden, #hud .warn.hidden { display: none; }
      #hud .warn { position: absolute; left: 0; right: 0; top: 18%; text-align: center; font-size: 18px; letter-spacing: .2em; color: #ffb36b; animation: blink 0.8s steps(2) infinite; }
      @keyframes blink { to { opacity: .35; } }
      #hud .flash { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at center, rgba(255,80,40,0) 45%, rgba(255,80,40,.9) 100%); }
      #hud .scheme { position: absolute; right: 24px; bottom: 24px; font-size: 13px; letter-spacing: .18em; color: #ffd9a8; opacity: 0; }
      #hud .perf { position: absolute; right: 24px; top: 16px; font-size: 12px; text-align: right; white-space: pre; opacity: .8; }
      #hud .hp { position: absolute; left: 24px; bottom: 90px; width: 160px; height: 4px; background: rgba(255,120,120,.2); }
      #hud .hp > i { display: block; height: 100%; width: 100%; background: #9fe3a0; }
      #hud .hp > i.hurt { background: #ff6a4a; }
      #hud .mission { position: absolute; left: 24px; top: 16px; font-size: 13px; letter-spacing: .12em; color: #ffd9a8; }
      #hud .mission .obj { display: block; color: #cfe9ff; letter-spacing: .04em; margin-top: 4px; font-size: 14px; opacity: .9; }
      #hud .reticle { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border: 1.5px solid rgba(207,233,255,.75); border-radius: 50%; }
      #hud .reticle::after { content: ""; position: absolute; left: 50%; top: 50%; width: 3px; height: 3px; margin: -1.5px 0 0 -1.5px; background: #cfe9ff; }
      #hud .tgt { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border: 1.5px solid #ffb36b; display: none; }
      #hud .tgt.on { display: block; }
      #hud .tgt.locked { border-color: #ff5a3a; }
      #hud .tgt.locking { border-style: dashed; }
      #hud .tgt.marker { border-color: #7fd4ff; border-radius: 50%; }
      #hud .ammo { position: absolute; left: 24px; bottom: 102px; font-size: 12px; letter-spacing: .25em; color: #ffd9a8; }
      #hud .tgt small { position: absolute; left: 0; top: 100%; margin-top: 4px; font-size: 11px; color: #ffd9a8; white-space: nowrap; }
      #hud .lead { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border: 1.5px solid #ffb36b; border-radius: 50%; display: none; }
      #hud .lead.on { display: block; }
      #hud .arrow { position: absolute; left: 50%; top: 50%; width: 0; height: 0; margin: -8px 0 0 -8px; border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 16px solid #ffb36b; display: none; transform-origin: 50% 50%; }
      #hud .arrow.on { display: block; }
      #hud .card { position: absolute; left: 0; right: 0; top: 34%; text-align: center; display: none; }
      #hud .card.on { display: block; }
      #hud .card .again { white-space: pre; }
      #hud .replay { display: none; position: absolute; left: 0; right: 0; top: 6%; text-align: center; letter-spacing: .4em; font-size: 22px; color: #ffd9a8; }
      #hud .replay small { display: block; letter-spacing: .12em; font-size: 12px; opacity: .7; margin-top: 8px; }
      #hud.replaying > *:not(.replay):not(.perf) { display: none !important; }
      #hud.replaying .replay { display: block; }
      #hud .card h1 { margin: 0; font-size: 34px; letter-spacing: .3em; font-weight: 500; color: #ffd9a8; }
      #hud .card h1.lost { color: #ff6a4a; }
      #hud .card p { margin: 14px 0 0; font-size: 15px; letter-spacing: .06em; opacity: .9; white-space: pre-line; }
      #hud .card .again { margin-top: 26px; font-size: 13px; letter-spacing: .2em; opacity: .7; animation: blink 1.2s steps(2) infinite; }
      #menu { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(4,6,12,.72); color: #cfe9ff; font-family: ui-monospace, "JetBrains Mono", Menlo, monospace; }
      #menu.on { display: flex; }
      #menu .panel { width: 420px; padding: 28px 32px 24px; border: 1px solid rgba(255,217,168,.45); background: rgba(8,10,20,.92); box-shadow: 0 0 0 4px rgba(8,10,20,.6); }
      #menu .title { margin: 0; font-size: 22px; letter-spacing: .32em; font-weight: 500; color: #ffd9a8; }
      #menu .sub { margin: 6px 0 22px; font-size: 12px; letter-spacing: .08em; opacity: .75; }
      #menu label { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; letter-spacing: .06em; margin: 10px 0; }
      #menu label span { opacity: .85; }
      #menu select, #menu input[type=range] { width: 180px; accent-color: #ffb36b; background: #0c1020; color: #cfe9ff; border: 1px solid rgba(207,233,255,.3); font: inherit; padding: 3px 6px; }
      #menu input[type=checkbox] { width: 16px; height: 16px; accent-color: #ffb36b; margin: 0 82px 0 0; }
      #menu .sens-v { font-size: 11px; opacity: .7; width: 34px; text-align: right; }
      #menu .row { display: flex; gap: 10px; margin-top: 22px; }
      #menu button { flex: 1; padding: 10px 0; font: inherit; font-size: 13px; letter-spacing: .22em; color: #ffd9a8; background: transparent; border: 1px solid #ffd9a8; cursor: pointer; }
      #menu button.fly { background: #ffd9a8; color: #0c1020; }
      #menu button:hover { filter: brightness(1.15); }
      #menu .keys { margin: 18px 0 0; font-size: 11px; letter-spacing: .04em; opacity: .6; line-height: 1.6; }
      #hub { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(4,6,12,.8); color: #cfe9ff; font-family: ui-monospace, "JetBrains Mono", Menlo, monospace; }
      #hub.on { display: flex; }
      #hub .panel { width: 720px; max-height: 92vh; overflow-y: auto; padding: 26px 30px 22px; border: 1px solid rgba(255,217,168,.45); background: rgba(8,10,20,.94); }
      #hub h1 { margin: 0 0 4px; font-size: 20px; letter-spacing: .3em; font-weight: 500; color: #ffd9a8; }
      #hub h2 { margin: 22px 0 8px; font-size: 12px; letter-spacing: .22em; font-weight: 500; opacity: .7; }
      #hub .missions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      #hub .missions h3 { grid-column: 1 / -1; margin: 14px 0 0; padding-top: 10px; border-top: 1px solid rgba(255,217,168,.25); font-weight: 500; }
      #hub .missions h3:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
      #hub .missions h3 b { display: block; font-size: 12px; letter-spacing: .3em; color: #ffd9a8; }
      #hub .missions h3 small { display: block; margin-top: 3px; font-size: 11px; opacity: .7; font-weight: 400; }
      #hub .missions h3.locked { opacity: .45; }
      #dial { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: rgba(4,6,12,.55); color: #cfe9ff; font-family: ui-monospace, "JetBrains Mono", Menlo, monospace; pointer-events: none; }
      #dial.on { display: flex; }
      #dial .ring { position: relative; width: 220px; height: 220px; border-radius: 50%; border: 6px solid #3a3f48; box-shadow: 0 0 0 3px #0c1020, inset 0 0 0 3px #0c1020, inset 0 0 40px rgba(60,120,255,.35); }
      #dial .ring i { position: absolute; left: 50%; top: 50%; width: 14px; height: 22px; margin: -11px 0 0 -7px; background: #5a4a30; clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: 50% 50%; transition: background .12s, box-shadow .12s; }
      #dial .ring i.on { background: #ffb36b; box-shadow: 0 0 14px #ff9a3a; }
      #dial .dest { font-size: 22px; letter-spacing: .35em; color: #ffd9a8; }
      #dial .line { font-size: 12px; letter-spacing: .25em; opacity: .8; }
      #hub .m { text-align: left; padding: 12px 14px; font: inherit; color: #cfe9ff; background: rgba(12,16,32,.9); border: 1px solid rgba(207,233,255,.25); cursor: pointer; }
      #hub .m:hover { border-color: #ffd9a8; }
      #hub .m.sel { border-color: #ffb36b; box-shadow: inset 0 0 0 1px #ffb36b; }
      #hub .m.locked { opacity: .45; cursor: default; }
      #hub .m b { display: block; font-weight: 500; font-size: 13px; letter-spacing: .16em; color: #ffd9a8; }
      #hub .m small { display: block; margin-top: 6px; font-size: 11.5px; line-height: 1.45; opacity: .85; }
      #hub .m i { display: block; margin-top: 8px; font-size: 11px; letter-spacing: .1em; color: #9fe3a0; font-style: normal; }
      #hub .m.locked i { color: #ffb36b; }
      #hub .ships { display: flex; gap: 10px; }
      #hub .s { flex: 1; text-align: left; padding: 10px 14px; font: inherit; color: #cfe9ff; background: rgba(12,16,32,.9); border: 1px solid rgba(207,233,255,.25); cursor: pointer; }
      #hub .s.sel { border-color: #ffb36b; box-shadow: inset 0 0 0 1px #ffb36b; }
      #hub .s.locked { opacity: .45; cursor: default; }
      #hub .s b { display: block; font-weight: 500; font-size: 13px; letter-spacing: .16em; color: #ffd9a8; }
      #hub .s small { display: block; margin-top: 4px; font-size: 11.5px; opacity: .85; }
      #hub .stats { display: flex; gap: 14px; margin-top: 8px; font-size: 10.5px; letter-spacing: .06em; opacity: .75; }
      #hub .row { display: flex; gap: 10px; margin-top: 22px; }
      #hub button.act { flex: 1; padding: 10px 0; font: inherit; font-size: 13px; letter-spacing: .22em; color: #ffd9a8; background: transparent; border: 1px solid #ffd9a8; cursor: pointer; }
      #hub button.act.go { background: #ffd9a8; color: #0c1020; }
      #hub button.act:disabled { opacity: .4; cursor: default; }
      .lil-gui { --width: 300px; }
    </style>
  </head>
  <body>
    <div id="hud">
      <div class="flash"></div>
      <div class="warn hidden">LEAVING THE FIELD &middot; TURN BACK</div>
      <div class="hint"></div>
      <div class="scheme"></div>
      <div class="reticle"></div>
      <div class="tgt"><small></small></div>
      <div class="lead"></div>
      <div class="arrow"></div>
      <div class="mission"><span class="title"></span><span class="obj"></span></div>
      <div class="hp"><i></i></div>
      <div class="ammo"></div>
      <div class="card"><h1></h1><p></p><div class="again">R · FLY AGAIN</div></div>
      <div class="replay"><span>REPLAY</span><small>V · skip</small></div>
      <div class="boost"><i></i></div>
      <div class="throttle"><i></i></div>
      <div class="speed"><span class="v">0</span><small>m/s</small></div>
      <div class="perf"></div>
    </div>
    <div id="menu">
      <div class="panel">
        <h1 class="title">STARGATE EXPLORER</h1>
        <p class="sub"></p>
        <label><span>Controls</span><select name="scheme"><option value="arcade">arcade · W/S pull up, Space brake</option><option value="classic">classic · W/S throttle, Space drift</option></select></label>
        <label><span>Flight assist (X)</span><input type="checkbox" name="assist" /></label>
        <label><span>Mouse sensitivity</span><input type="range" name="sens" min="0.4" max="2.5" step="0.05" /><i class="sens-v"></i></label>
        <label><span>Difficulty</span><select name="difficulty"><option value="easy">easy</option><option value="normal">normal</option><option value="hard">hard</option></select></label>
        <label><span>Mute (M)</span><input type="checkbox" name="mute" /></label>
        <div class="row"><button class="fly">FLY</button><button class="restart">RESTART</button><button class="replay">REPLAY THE KILL</button><button class="hub">MISSIONS</button></div>
        <p class="keys">mouse steers · A/D roll, double-tap barrel roll · Shift boost · LMB cannons · RMB missile once locked · C scheme · X assist · Esc pause · ` tuning</p>
      </div>
    </div>
    <div id="dial">
      <div class="ring"></div>
      <div class="dest"></div>
      <div class="line"></div>
    </div>
    <div id="hub">
      <div class="panel">
        <h1>MISSIONS</h1>
        <h2>SORTIE</h2>
        <div class="missions"></div>
        <h2>SHIP</h2>
        <div class="ships"></div>
        <div class="row"><button class="act go">LAUNCH</button><button class="act back">BACK</button></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
